name: Upstream review queue
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: upstream-review-queue
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'DrMaks22/paperclip-localizations' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Inspect stable and master and maintain one review issue
        run: npm run check:upstream -- --issue
        env:
          GH_TOKEN: ${{ github.token }}
